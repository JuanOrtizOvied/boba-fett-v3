name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"

jobs:
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn workspace web lint

      - name: Build
        run: yarn workspace web build

  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret-ci
      JWT_REFRESH_SECRET: test-refresh-secret-ci
      ANTHROPIC_API_KEY: sk-ant-fake-for-ci
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sabbi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/

      # No fallback for "no tests found" — an empty test suite MUST fail CI.
      # pytest exits non-zero (code 5) when zero tests are collected.
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sabbi_test
        run: pytest -q
