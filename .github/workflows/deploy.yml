name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  changes:
    name: Detect changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/web/**'
            backend:
              - 'apps/backend/**'
            infra:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

  tag:
    name: Bump version tag
    needs: [changes]
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump and tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: minor
          WITH_V: true
          INITIAL_VERSION: 1.0.0

  build-frontend:
    name: Build frontend image
    needs: [tag, changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPO_FRONTEND }}
          VERSION: ${{ needs.tag.outputs.new_tag }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  build-backend:
    name: Build backend image
    needs: [tag, changes, build-frontend]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPO_BACKEND }}
          VERSION: ${{ needs.tag.outputs.new_tag }}
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            apps/backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  migrate:
    name: Database migrations
    needs: [build-frontend, build-backend]
    if: always() && !failure() && !cancelled()
    uses: ./.github/workflows/migrate.yml
    with:
      environment: staging
    secrets: inherit

  deploy:
    name: Deploy to staging
    needs: [changes, migrate]
    if: always() && !failure() && !cancelled()
    runs-on: staging-server
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy compose file
        run: |
          cp deploy/docker-compose.yml /home/ubuntu/apps/boba-fett/docker-compose.yml

      - name: Write .env from Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id ${{ secrets.AWS_SECRET_NAME }} \
            --query 'SecretString' --output text \
            | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' \
            > /home/ubuntu/apps/boba-fett/.env

      - name: Pull images
        run: cd /home/ubuntu/apps/boba-fett && docker compose pull

      - name: Start services
        run: cd /home/ubuntu/apps/boba-fett && docker compose up -d --remove-orphans && docker image prune -f
