name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  changes:
    name: Detect changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/web/**'
            backend:
              - 'apps/backend/**'
            infra:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

  tag:
    name: Bump version tag
    needs: [changes]
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump and tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: minor
          WITH_V: true
          INITIAL_VERSION: 1.0.0

  build-frontend:
    name: Build frontend image
    needs: [tag, changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_FRONTEND }}
          VERSION: ${{ needs.tag.outputs.new_tag }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  build-backend:
    name: Build backend image
    needs: [tag, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_BACKEND }}
          VERSION: ${{ needs.tag.outputs.new_tag }}
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            apps/backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  migrate:
    name: Database migrations
    needs: [build-frontend, build-backend]
    if: always() && !failure() && !cancelled()
    uses: ./.github/workflows/migrate.yml
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws_region: ${{ secrets.AWS_REGION }}
      aws_secret_name: ${{ secrets.AWS_SECRET_NAME }}

  deploy:
    name: Deploy to EC2
    needs: [changes, migrate]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy compose file to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /opt/sabbi"
          scp -i ~/.ssh/deploy_key \
            deploy/docker-compose.yml \
            ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }}:/opt/sabbi/docker-compose.yml

      - name: Write .env and pull images
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }} bash -s <<'REMOTE'
            set -euo pipefail

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            cd /opt/sabbi

            cat > .env <<'ENVEOF'
          ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
          ECR_REPO_FRONTEND=${{ secrets.ECR_REPO_FRONTEND }}
          ECR_REPO_BACKEND=${{ secrets.ECR_REPO_BACKEND }}
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          POSTGRES_URI=${{ secrets.POSTGRES_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ENVEOF

            docker compose pull
          REMOTE

      - name: Start services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }} \
            "cd /opt/sabbi && docker compose up -d --remove-orphans && docker image prune -f"
