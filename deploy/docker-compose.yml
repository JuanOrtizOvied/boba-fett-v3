services:
  traefik:
    image: traefik:v3.4
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  web:
    image: ${ECR_REGISTRY}/${ECR_REPO_FRONTEND}:latest
    restart: unless-stopped
    environment:
      - PORTFOLIO_API_URL=http://backend:8000
      - LANGGRAPH_API_URL=http://backend:8000
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - NEXT_PUBLIC_LANGGRAPH_ASSISTANT_ID=agent
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`boba-fett.sabbi.com`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=3000
    depends_on:
      - backend

  backend:
    image: ${ECR_REGISTRY}/${ECR_REPO_BACKEND}:latest
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=true
      - LANGSMITH_PROJECT=boba-fett-v3
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_URI=${POSTGRES_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`boba-fett-api.sabbi.com`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=8000

volumes:
  letsencrypt:
